plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.13'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '6.25.0'
}

group = 'com.followMe'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
	maven {
		url "https://maven.pkg.github.com/8ollowMe/common-lib"
		credentials {
			username = findProperty("gpr.user")
			password = findProperty("gpr.key")
		}
	}
}

ext {
	set('springCloudVersion', "2025.0.1")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'

	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
	implementation 'io.github.openfeign:feign-okhttp:11.8'

	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'
	implementation 'org.springframework.cloud:spring-cloud-starter-config'
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	implementation 'com.followMe:common-lib:1.0.7'

	implementation "io.github.openfeign.querydsl:querydsl-core:7.1"
	implementation "io.github.openfeign.querydsl:querydsl-jpa:7.1"

	annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:7.1:jakarta"

	annotationProcessor "jakarta.annotation:jakarta.annotation-api"
	annotationProcessor "jakarta.persistence:jakarta.persistence-api"

	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.16'

	// 모니터링 및 메트릭 수집 (필수)
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// 분산 추적 - Micrometer Tracing (Brave 브릿지 사용)
	implementation 'io.micrometer:micrometer-tracing-bridge-brave'

	// Zipkin으로 트레이스 데이터를 전송하는 리포터
	implementation 'io.zipkin.reporter2:zipkin-reporter-brave'
//
//	implementation 'net.logstash.logback:logstash-logback-encoder:7.4'
//// Additional Logback appenders
//	implementation 'com.sndyuk:logback-more-appenders:1.8.3'
//
//	// Fluentd appender
//	implementation 'org.fluentd:fluent-logger:0.3.4'
//
//	// Fluency core (optional)
//	implementation 'org.komamitsu:fluency-core:2.4.1'
//
//	// Fluency for Fluentd (optional)
//	implementation 'org.komamitsu:fluency-fluentd:2.4.1'

	implementation 'org.springframework.kafka:spring-kafka'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

spotless {
	java {
		googleJavaFormat('1.24.0')
		target 'src/**/*.java'
		targetExclude 'src/main/generated/**/*.java' // ← Q클래스 제외
	}
}